# Deploy the SPA to Cloudflare Workers Static Assets on every push to main.
# Manual runs are also possible from the Actions tab (workflow_dispatch).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - API token with "Edit Cloudflare Workers" permission
#                           (Cloudflare dashboard > Account API tokens > Create Token)
#   CLOUDFLARE_ACCOUNT_ID - Account ID (dashboard URL or Account > Overview)
#
# Optional repository variable (Settings > Secrets and variables > Actions > Variables):
#   VITE_API_BASE_URL     - Rails API base URL baked in at build time.
#                           Unset = empty string (current FE-only mock mode still works).
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      # Fill in after the first deploy, e.g. https://adjuster-portal.<subdomain>.workers.dev
      # url: https://adjuster-portal.<subdomain>.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
